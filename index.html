<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tủ Truyện</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header>

    <div class="topbar">

        <h1>📚 TỦ TRUYỆN</h1>

        <button id="darkModeBtn">
            🌙
        </button>

    </div>


    <input
        type="text"
        id="searchInput"
        placeholder="Tìm tên truyện..."
    >


    <div class="file-box">

        <input
            type="file"
            id="txtFiles"
            accept=".txt"
            multiple
        >

        <button onclick="loadTxtFiles()">
            📂 Thêm file TXT
        </button>

    </div>

</header>



<main>


    <!-- ========================= -->
    <!-- TRANG CHỦ -->
    <!-- ========================= -->

    <section id="homePage">

        <h2>
            Danh sách truyện
        </h2>

        <div id="storyList"></div>

    </section>



    <!-- ========================= -->
    <!-- DANH SÁCH CHƯƠNG -->
    <!-- ========================= -->

    <section
        id="chapterPage"
        class="hidden"
    >

        <button onclick="goHome()">
            ← Quay lại
        </button>


        <div class="story-header">

            <div>

                <h2 id="storyTitle"></h2>

                <p id="storyAuthor"></p>

            </div>


            <button
                class="delete-story-btn"
                onclick="deleteCurrentStory()"
            >
                🗑 Xóa truyện
            </button>

        </div>


        <h3>
            Danh sách chương
        </h3>


        <div id="chapterList"></div>

    </section>



    <!-- ========================= -->
    <!-- TRANG ĐỌC -->
    <!-- ========================= -->

    <section
        id="readerPage"
        class="hidden"
    >


        <button onclick="goChapters()">
            ← Danh sách chương
        </button>


        <h2 id="readerTitle"></h2>


        <!-- CHUYỂN CHƯƠNG Ở ĐẦU -->

        <div class="chapterNavigation top-navigation">

            <button
                id="prevBtnTop"
                onclick="previousChapter()"
            >
                ← Chương trước
            </button>


            <button
                id="nextBtnTop"
                onclick="nextChapter()"
            >
                Chương sau →
            </button>

        </div>


        <!-- CỠ CHỮ -->

        <div class="reader-control">

            <button onclick="changeFontSize(-1)">
                A−
            </button>

            <button onclick="changeFontSize(1)">
                A+
            </button>

        </div>


        <!-- NỘI DUNG -->

        <article id="storyContent"></article>


        <!-- CHUYỂN CHƯƠNG Ở CUỐI -->

        <div class="chapterNavigation">

            <button
                id="prevBtn"
                onclick="previousChapter()"
            >
                ← Chương trước
            </button>


            <button
                id="nextBtn"
                onclick="nextChapter()"
            >
                Chương sau →
            </button>

        </div>


    </section>


</main>



<script src="script.js"></script>


</body>

</html>
